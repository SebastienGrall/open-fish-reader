[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-fish-reader"
version = "0.1.0-alpha"
description = "Dépouillement scientifique des vidéos Open Fish Counter"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = ["PySide6>=6.8,<7", "av>=14,<17", "platformdirs>=4.3,<5", "numpy>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-qt>=4.4,<5", "ruff>=0.8,<1", "mypy>=1.13,<2"]

[project.scripts]
open-fish-reader = "open_fish_reader.application:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.package-data]
open_fish_reader = ["resources/*.csv"]
